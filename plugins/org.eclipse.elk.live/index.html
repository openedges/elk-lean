<!doctype html>
<!-- SPDX-License-Identifier: EPL-2.0 OR GPL-3.0-or-later -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELK Live (elk-lean)</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
  <header class="toolbar">
    <span class="brand">ELK Live <small>elk-lean <span id="engine-version">0.12.0</span></small></span>
    <label class="field">Example
      <select id="example-select" aria-label="Example">
        <option value="">(custom)</option>
      </select>
    </label>
    <label class="field">Format
      <select id="format-select" aria-label="Input format">
        <option value="elkt">ELK Text (.elkt)</option>
        <option value="json">ELK JSON</option>
      </select>
    </label>
    <span class="spacer"></span>
    <button id="fit-button" type="button" title="Fit the diagram to the view">Fit</button>
    <button id="svg-button" type="button" title="Download the diagram as SVG">SVG</button>
    <button id="json-button" type="button" title="Download the laid-out graph as ELK JSON">JSON</button>
    <a id="model-link" href="#" title="Link to this model (the text is compressed into the URL)">Link</a>
    <button id="copy-link-button" type="button" title="Copy the link to this model">Copy link</button>
    <button id="dark-toggle" type="button" title="Toggle dark mode" aria-pressed="false">Dark</button>
  </header>
  <section id="example-doc" class="example-doc" hidden>
    <strong id="example-title"></strong> <span id="example-category" class="muted"></span>
    <div id="example-description"></div>
  </section>
  <main class="panes">
    <div class="pane editor-pane">
      <div id="monaco-editor"></div>
    </div>
    <div class="pane diagram-pane">
      <div id="sprotty" class="sprotty"></div>
      <div id="loading" class="loading-overlay">
        <div class="spinner" aria-hidden="true"></div>
        <div id="loading-text">Loading the layout engine (WebAssembly)&hellip;</div>
      </div>
    </div>
  </main>
  <footer class="statusbar">
    <span id="status" role="status">Starting&hellip;</span>
    <span class="spacer"></span>
    <span class="muted">
      <a href="https://www.eclipse.org/elk/documentation/tooldevelopers/graphdatastructure/elktextformat.html">ELK Text</a>
      &middot; layout by elk-lean (ELK 0.12.0 in Lean 4, WebAssembly) &middot; EPL-2.0 OR GPL-3.0-or-later
    </span>
  </footer>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
